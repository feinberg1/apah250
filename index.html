<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APAH 250 Study Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with three views; works shown as museum wall labels (number, title, maker, then date / medium / place rows) */
:root{
  --bg:#eceeea; --surface:#f8f9f6; --sunk:#e2e5df; --ink:#1b211e; --muted:#5b645d; --line:#cdd3ca;
  --accent:#2846b8; --accent-soft:#dfe5fb; --on-accent:#ffffff;
  --good:#1d7449; --good-soft:#d9efe2; --bad:#ad3329; --bad-soft:#f6dedb;
  --f-display:"Bricolage Grotesque","Archivo",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1a1f1c; --sunk:#151917; --ink:#e6eae5; --muted:#99a39b; --line:#2d3530;
  --accent:#8fa5ff; --accent-soft:#1f2a52; --on-accent:#0e1330;
  --good:#5fc490; --good-soft:#163526; --bad:#f08b80; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1a1f1c; --sunk:#151917; --ink:#e6eae5; --muted:#99a39b; --line:#2d3530;
  --accent:#8fa5ff; --accent-soft:#1f2a52; --on-accent:#0e1330;
  --good:#5fc490; --good-soft:#163526; --bad:#f08b80; --bad-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font:800 22px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto}
nav a{padding:7px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.count{font:600 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.count b{color:var(--accent)}
main{padding-block:24px 64px}
h2{font:700 clamp(24px,3.4vw,34px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* select view */
.unit{margin-top:28px}
.unit-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.unit-head h3{font:700 19px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.unit-head .rng{font:500 12px var(--f-mono);color:var(--muted)}
.unit-head .sp{flex:1}
.unit-head .btn{padding:5px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.work{display:flex;gap:10px;align-items:center;padding:6px 8px 6px 6px;border-radius:8px;border:1px solid transparent;cursor:pointer;min-width:0}
.work:hover{background:var(--surface)}
.work.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.work input{position:absolute;opacity:0;pointer-events:none}
.work:has(input:focus-visible){outline:2px solid var(--accent)}
.th{flex:0 0 52px;height:52px;border-radius:6px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);position:relative}
.th .sp{display:block;width:52px;height:52px;background:url(thumbs.webp) 0 0/832px 832px no-repeat}
.work.on .th::after{content:"✓";position:absolute;inset:auto 3px 3px auto;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 11px/18px var(--f-body);text-align:center}
.wt{min-width:0}
.wt .no{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.wt .tt{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wt .by{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{color:var(--muted);padding:24px 0}

/* card */
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:16px}}
.fig{min-width:0}
.views{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.vw{width:58px;height:58px;padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;background:var(--sunk);cursor:pointer}
.vw img{width:100%;height:100%;object-fit:cover;display:block}
.vw.on{border-color:var(--accent)}
.vc{font:500 11.5px var(--f-mono);color:var(--muted);margin-left:4px}
figure{margin:0;background:var(--sunk);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%}
figure img{width:100%;height:100%;object-fit:contain}
.ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;
  background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--line) 55%,transparent) 14px 15px)}
.ph .big{font:800 clamp(48px,9vw,96px)/1 var(--f-display);color:var(--line);letter-spacing:-.04em}
.ph p{margin:0;color:var(--muted);font-size:13.5px;max-width:34ch}
.ph .links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ph a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:999px}
.label{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px}
.label .no{font:600 12px var(--f-mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.label h3{font:700 clamp(22px,2.6vw,28px)/1.15 var(--f-display);letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance}
.label .maker{color:var(--muted);font-weight:500;margin:0 0 14px}
dl{margin:0;display:grid;gap:0}
dl div{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
dt{font:600 11px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
dd{margin:0;min-width:0}
.hide dd{cursor:pointer}
.hide dd:not(.shown){color:transparent;background:var(--sunk);border-radius:5px;user-select:none}
.hide dd:not(.shown)::after{content:"tap to reveal";color:var(--muted);font-size:12px;font-family:var(--f-mono);margin-left:-.3em}
.hide dd:not(.shown) *{visibility:hidden}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.ctrls .pos{font:600 13px var(--f-mono);color:var(--muted);margin:0 6px;font-variant-numeric:tabular-nums}
.ctrls .sp{flex:1}
.hint{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:10px}

/* quiz */
.qset{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qset .lab{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.score{display:flex;gap:18px;margin-left:auto;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-weight:400}
.prompt{font:700 clamp(20px,2.4vw,25px)/1.2 var(--f-display);margin:4px 0 14px;letter-spacing:-.01em}
.qtitle{font-weight:600;margin:0 0 4px}
.qtitle.mute{color:var(--muted);font-weight:500;font-style:italic}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);padding:11px 14px 11px 44px;border-radius:9px;cursor:pointer;position:relative;line-height:1.35;min-height:46px}
.opt::before{content:attr(data-k);position:absolute;left:12px;top:11px;width:21px;height:21px;border-radius:5px;background:var(--sunk);font:600 12px/21px var(--f-mono);text-align:center;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right::before{background:var(--good);color:var(--surface);content:"✓"}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong::before{background:var(--bad);color:var(--surface);content:"✕"}
.verdict{margin-top:14px;padding:14px 16px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.verdict b.ok{color:var(--good)} .verdict b.no{color:var(--bad)}
.verdict dl div{grid-template-columns:96px 1fr;padding:6px 0}
.empty{margin-top:24px;padding:36px 24px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.empty p{color:var(--muted);margin:6px auto 16px;max-width:46ch}
.empty .ctrls{justify-content:center}
@media (max-width:560px){nav{margin-left:0;width:100%}nav a{flex:1;text-align:center}.score{margin-left:0}dl div{grid-template-columns:92px 1fr}}
@media (prefers-reduced-motion:no-preference){.card-in{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand">APAH 250 <small>Study room</small></div>
    <span class="count" id="count"></span>
    <nav aria-label="Views">
      <a href="#select" data-v="select">Select</a>
      <a href="#study" data-v="study">Study</a>
      <a href="#quiz" data-v="quiz">Quiz</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-select">
    <h2>Choose your works</h2>
    <p class="lede">Tick any of the 250 required works, or take a whole content area at once. Your picks stay saved in this browser and feed Study and Quiz.</p>
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search title, artist, medium, place, or number" aria-label="Search works">
      <label class="chk"><input type="checkbox" id="onlySel"> Selected only</label>
      <button class="btn" id="selAll">Select all 250</button>
      <button class="btn ghost" id="selNone">Clear</button>
    </div>
    <div id="units"></div>
  </section>

  <section id="v-study" hidden>
    <div class="toolbar" style="margin-top:0">
      <h2 style="margin-right:auto">Study</h2>
      <label class="chk"><input type="checkbox" id="hideDet"> Hide details (flashcard)</label>
      <button class="btn" id="shuf">Shuffle</button>
      <button class="btn ghost" id="order">Number order</button>
    </div>
    <div id="studyBody"></div>
  </section>

  <section id="v-quiz" hidden>
    <h2>Quiz</h2>
    <div class="qset">
      <span class="lab">Ask about</span>
      <label class="chk"><input type="checkbox" class="qf" value="date" checked> Date</label>
      <label class="chk"><input type="checkbox" class="qf" value="artist" checked> Artist</label>
      <label class="chk"><input type="checkbox" class="qf" value="medium" checked> Medium</label>
      <label class="chk"><input type="checkbox" class="qf" value="place" checked> Movement / location</label>
      <label class="chk"><input type="checkbox" id="showTitle" checked> Show title</label>
      <div class="score" id="score"></div>
    </div>
    <div id="quizBody"></div>
  </section>
</main>

const W = RAW.map(r => ({n:r[0], title:r[1], artist:r[2], date:r[3], medium:r[4], place:r[5], y:r[6], img:r[7]}));
const BY = Object.fromEntries(W.map(w => [w.n, w]));
const UNITS = [
  [1,"Global Prehistory",1,11],[2,"Ancient Mediterranean",12,51],[3,"Early Europe and Colonial Americas",52,98],
  [4,"Later Europe and Americas",99,152],[5,"Indigenous Americas",153,166],[6,"Africa",167,180],
  [7,"West and Central Asia",181,191],[8,"South, East, and Southeast Asia",192,212],[9,"The Pacific",213,223],
  [10,"Global Contemporary",224,250]];
const unitOf = n => UNITS.find(u => n >= u[2] && n <= u[3])[0];
const pad = n => String(n).padStart(3, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);

const store = {
  get(k, d){ try { const v = localStorage.getItem("apah." + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("apah." + k, JSON.stringify(v)); } catch(e){} }
};
let sel = new Set(store.get("sel", []));
const opts = Object.assign({hide:false, fields:["date","artist","medium","place"], showTitle:true}, store.get("opts", {}));
const saveSel = () => { store.set("sel", [...sel]); renderCount(); };
const saveOpts = () => store.set("opts", opts);
const selected = () => W.filter(w => sel.has(w.n));

function renderCount(){
  $("#count").innerHTML = `<b>${sel.size}</b> / 250 selected`;
}

/* ---------- figure ---------- */
function figure(w, big){
  if (w.img){
    let strip = "";
    if (w.img > 1){
      strip = `<div class="views" role="group" aria-label="Views">` + Array.from({length:w.img}, (_, i) =>
        `<button class="vw${i?"":" on"}" data-src="img/${w.n}-${i+1}.webp" aria-label="View ${i+1} of ${w.img}"><img src="img/${w.n}-${i+1}.webp" alt="" loading="lazy"></button>`).join("") +
        `<span class="vc">${w.img} views</span></div>`;
    }
    return `<div class="fig"><figure><img class="main" src="img/${w.n}-1.webp" alt="${esc(w.title)}"></figure>${strip}</div>`;
  }
  const q = encodeURIComponent(w.title + (w.artist ? " " + w.artist : ""));
  return `<figure><div class="ph"><div class="big">${pad(w.n)}</div>
    <p>No image bundled for this work yet.</p>
    <div class="links"><a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">Image search ↗</a>
    <a href="https://smarthistory.org/?s=${q}" target="_blank" rel="noopener">Smarthistory ↗</a></div></div></figure>`;
}
function labelRows(w, hide){
  const row = (k, v) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`;
  return `<dl>${row("Date", w.date)}${row("Artist", w.artist || "Unknown / no single artist")}${row("Medium", w.medium)}${row("Movement · place", w.place)}</dl>`;
}

/* ---------- select view ---------- */
function renderUnits(){
  const q = $("#q").value.trim().toLowerCase();
  const only = $("#onlySel").checked;
  let html = "", shown = 0;
  for (const [u, name, a, b] of UNITS){
    const works = W.filter(w => w.n >= a && w.n <= b);
    const vis = works.filter(w => (!only || sel.has(w.n)) &&
      (!q || String(w.n) === q || [w.title, w.artist, w.medium, w.place, w.date].join(" ").toLowerCase().includes(q)));
    if (!vis.length) continue;
    shown += vis.length;
    const on = works.filter(w => sel.has(w.n)).length;
    const all = on === works.length;
    html += `<div class="unit"><div class="unit-head"><h3>Unit ${u} · ${name}</h3><span class="rng">${a}–${b} · ${on}/${works.length}</span><span class="sp"></span>
      <button class="btn ghost" data-unit="${u}" data-mode="${all?"off":"on"}">${all?"Clear unit":"Select unit"}</button></div><div class="grid">`;
    for (const w of vis){
      const on1 = sel.has(w.n);
      html += `<label class="work${on1?" on":""}" data-n="${w.n}"><input type="checkbox" id="w${w.n}" ${on1?"checked":""}>
        <span class="th">${w.img ? `<i class="sp" style="background-position:${-((w.n-1)%16)*52}px ${-Math.floor((w.n-1)/16)*52}px"></i>` : pad(w.n)}</span>
        <span class="wt"><span class="no">No. ${pad(w.n)}</span><span class="tt">${esc(w.title)}</span><span class="by">${esc(w.artist || w.place)}</span></span></label>`;
    }
    html += `</div></div>`;
  }
  $("#units").innerHTML = shown ? html : `<p class="none">No works match “${esc(q)}”.</p>`;
}
$("#units").addEventListener("change", e => {
  const lab = e.target.closest(".work"); if (!lab) return;
  const n = +lab.dataset.n;
  e.target.checked ? sel.add(n) : sel.delete(n);
  lab.classList.toggle("on", e.target.checked);
  saveSel(); refreshUnitHeads();
});
$("#units").addEventListener("click", e => {
  const b = e.target.closest("[data-unit]"); if (!b) return;
  const [, , a, z] = UNITS[+b.dataset.unit - 1];
  for (let n = a; n <= z; n++) b.dataset.mode === "on" ? sel.add(n) : sel.delete(n);
  saveSel(); renderUnits();
});
function refreshUnitHeads(){
  document.querySelectorAll("[data-unit]").forEach(b => {
    const [, , a, z] = UNITS[+b.dataset.unit - 1];
    let on = 0; for (let n = a; n <= z; n++) if (sel.has(n)) on++;
    const all = on === z - a + 1;
    b.dataset.mode = all ? "off" : "on"; b.textContent = all ? "Clear unit" : "Select unit";
    b.parentElement.querySelector(".rng").textContent = `${a}–${z} · ${on}/${z-a+1}`;
  });
}
$("#q").addEventListener("input", renderUnits);
$("#onlySel").addEventListener("change", renderUnits);
$("#selAll").onclick = () => { W.forEach(w => sel.add(w.n)); saveSel(); renderUnits(); };
$("#selNone").onclick = () => { sel.clear(); saveSel(); renderUnits(); };

/* ---------- study view ---------- */
let deck = [], di = 0;
function buildDeck(shuffle){
  deck = selected().map(w => w.n);
  if (shuffle) shuffleArr(deck);
  di = 0;
}
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function emptyState(where){
  return `<div class="empty"><h3 class="prompt" style="margin:0">Nothing selected yet</h3>
    <p>Pick works on the Select tab, or start with all 250 required works.</p>
    <div class="ctrls"><a class="btn" href="#select">Pick works</a><button class="btn primary" data-useall="${where}">Use all 250</button></div></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-useall]"); if (!b) return;
  W.forEach(w => sel.add(w.n)); saveSel(); renderUnits();
  b.dataset.useall === "study" ? (buildDeck(false), renderStudy()) : nextQ();
});
function renderStudy(){
  const body = $("#studyBody");
  deck = deck.filter(n => sel.has(n));
  if (!deck.length && sel.size) buildDeck(false);
  if (!deck.length){ body.innerHTML = emptyState("study"); return; }
  di = Math.max(0, Math.min(di, deck.length - 1));
  const w = BY[deck[di]];
  body.innerHTML = `<div class="stage card-in">${figure(w, true)}
    <div><div class="label${opts.hide ? " hide" : ""}"><div class="no">No. ${pad(w.n)} · Unit ${unitOf(w.n)}</div>
      <h3>${esc(w.title)}</h3><p class="maker">${esc(w.artist || "No single named artist")}</p>${labelRows(w)}</div>
      <div class="ctrls"><button class="btn" id="prev" ${di?"":"disabled"}>← Prev</button>
      <span class="pos">${di + 1} / ${deck.length}</span>
      <button class="btn primary" id="next" ${di < deck.length - 1 ? "" : "disabled"}>Next →</button></div>
      <div class="hint">Keys: ← → to move${opts.hide ? ", space to reveal all" : ""}</div></div></div>`;
  $("#prev").onclick = () => { di--; renderStudy(); };
  $("#next").onclick = () => { di++; renderStudy(); };
}
$("#studyBody").addEventListener("click", e => {
  const dd = e.target.closest(".hide dd"); if (dd) dd.classList.add("shown");
});
$("#hideDet").checked = opts.hide;
$("#hideDet").onchange = e => { opts.hide = e.target.checked; saveOpts(); renderStudy(); };
$("#shuf").onclick = () => { buildDeck(true); renderStudy(); };
$("#order").onclick = () => { buildDeck(false); renderStudy(); };

/* ---------- quiz ---------- */
const PROMPT = {date:"When was this made?", artist:"Who made this?", medium:"What is the medium?", place:"What movement / culture and location?"};
const FIELD_LABEL = {date:"Date", artist:"Artist", medium:"Medium", place:"Movement · place"};
let qs = {right:0, total:0, streak:0}, cur = null, missed = new Set(), missedMode = false;

function gapFor(y){ return y < -1000 ? 800 : y < 0 ? 150 : y < 1000 ? 100 : y < 1700 ? 25 : y < 1900 ? 12 : 4; }
function distractors(w, f){
  const pick = (pool) => { const out = []; for (const v of shuffleArr(pool)) { if (v !== w[f] && !out.includes(v)) out.push(v); if (out.length === 3) break; } return out; };
  if (f === "date" || f === "artist"){
    const g = f === "date" ? gapFor(w.y) : 0;
    const pool = W.filter(x => x.n !== w.n && x[f] && x[f] !== w[f] && Math.abs(x.y - w.y) >= g)
      .sort((a, b) => Math.abs(a.y - w.y) - Math.abs(b.y - w.y));
    const uniq = [...new Set(pool.map(x => x[f]))];
    return pick(uniq.slice(0, 10));
  }
  const u = unitOf(w.n);
  const same = [...new Set(W.filter(x => unitOf(x.n) === u).map(x => x[f]))];
  let out = pick(same);
  if (out.length < 3){ const rest = pick([...new Set(W.map(x => x[f]))].filter(v => !out.includes(v))); out = out.concat(rest).slice(0, 3); }
  return out;
}
function nextQ(){
  const body = $("#quizBody");
  let pool = selected();
  if (missedMode){ pool = pool.filter(w => missed.has(w.n)); if (!pool.length){ missedMode = false; pool = selected(); } }
  if (!pool.length){ body.innerHTML = emptyState("quiz"); renderScore(); return; }
  const fields = opts.fields.length ? opts.fields : ["date","artist","medium","place"];
  let w, f, tries = 0;
  do {
    w = pool[Math.floor(Math.random() * pool.length)];
    const avail = fields.filter(k => k !== "artist" || w.artist);
    f = avail[Math.floor(Math.random() * avail.length)];
  } while ((!f || (cur && pool.length > 1 && w.n === cur.w.n)) && ++tries < 40);
  if (!f) f = fields.find(k => k !== "artist") || "date";
  const choices = shuffleArr([w[f], ...distractors(w, f)]);
  cur = {w, f, choices, done:false};
  renderQ();
}
function renderQ(){
  const {w, f, choices, done, picked} = cur;
  const showT = opts.showTitle || !w.img;
  $("#quizBody").innerHTML = `<div class="stage card-in">${figure(w, true)}<div>
    ${showT ? `<p class="qtitle">No. ${pad(w.n)} · ${esc(w.title)}</p>` : `<p class="qtitle mute">Title hidden</p>`}
    <p class="prompt">${PROMPT[f]}</p>
    <div class="opts">${choices.map((c, i) => {
      let cls = "opt";
      if (done){ if (c === w[f]) cls += " right"; else if (i === picked) cls += " wrong"; }
      return `<button class="${cls}" data-i="${i}" data-k="${i+1}" ${done?"disabled":""}>${esc(c)}</button>`;
    }).join("")}</div>
    ${done ? `<div class="verdict">${picked === -1 ? "" : (choices[picked] === w[f] ? `<b class="ok">Correct.</b>` : `<b class="no">Not quite.</b>`)}
      <span style="color:var(--muted)">No. ${pad(w.n)} · ${esc(w.title)}</span>${labelRows(w)}</div>
      <div class="ctrls"><button class="btn primary" id="nq">Next question →</button><span class="sp"></span>
      ${missed.size ? `<button class="btn ghost" id="mm">${missedMode ? "Quiz all selected" : `Quiz missed only (${missed.size})`}</button>` : ""}</div>
      <div class="hint">Enter for next question</div>`
    : `<div class="hint">Keys: 1–4 to answer</div>`}</div></div>`;
  if (done){
    $("#nq").onclick = nextQ;
    const mm = $("#mm"); if (mm) mm.onclick = () => { missedMode = !missedMode; nextQ(); };
    $("#nq").focus({preventScroll:true});
  }
  renderScore();
}
function answer(i){
  if (!cur || cur.done) return;
  cur.done = true; cur.picked = i;
  const ok = cur.choices[i] === cur.w[cur.f];
  qs.total++; if (ok){ qs.right++; qs.streak++; missed.delete(cur.w.n); } else { qs.streak = 0; missed.add(cur.w.n); }
  renderQ();
}
$("#quizBody").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) answer(+b.dataset.i); });
function renderScore(){
  const pct = qs.total ? Math.round(100 * qs.right / qs.total) + "%" : "–";
  $("#score").innerHTML = `<div>${qs.right}/${qs.total} <span>right</span></div><div>${pct}</div><div>${qs.streak} <span>streak</span></div>`;
}
document.querySelectorAll(".qf").forEach(c => {
  c.checked = opts.fields.includes(c.value);
  c.onchange = () => {
    opts.fields = [...document.querySelectorAll(".qf:checked")].map(x => x.value);
    if (!opts.fields.length){ c.checked = true; opts.fields = [c.value]; }
    saveOpts(); if (cur && !cur.done) nextQ();
  };
});
$("#showTitle").checked = opts.showTitle;
$("#showTitle").onchange = e => { opts.showTitle = e.target.checked; saveOpts(); if (cur) renderQ(); };

document.addEventListener("click", e => {
  const b = e.target.closest(".vw"); if (!b) return;
  const fig = b.closest(".fig");
  fig.querySelector("img.main").src = b.dataset.src;
  fig.querySelectorAll(".vw").forEach(x => x.classList.toggle("on", x === b));
});
/* ---------- routing & keys ---------- */
let view = "select";
function route(){
  const h = location.hash.slice(1);
  view = ["select","study","quiz"].includes(h) ? h : "select";
  for (const v of ["select","study","quiz"]) $("#v-" + v).hidden = v !== view;
  document.querySelectorAll("nav a").forEach(a => a.dataset.v === view ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if (view === "select") renderUnits();
  if (view === "study"){ if (!deck.length || deck.some(n => !sel.has(n)) || deck.length !== sel.size) buildDeck(false); renderStudy(); }
  if (view === "quiz"){ if (!cur || !sel.has(cur.w.n)) nextQ(); else renderQ(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav a").forEach(a => a.addEventListener("click", () => { if (location.hash === "#" + a.dataset.v) route(); }));
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === "study" && deck.length){
    if (e.key === "ArrowRight" && di < deck.length - 1){ di++; renderStudy(); }
    else if (e.key === "ArrowLeft" && di > 0){ di--; renderStudy(); }
    else if (e.key === " " && opts.hide){ e.preventDefault(); document.querySelectorAll(".hide dd").forEach(d => d.classList.add("shown")); }
  }
  if (view === "quiz" && cur){
    if (!cur.done && /^[1-4]$/.test(e.key) && +e.key <= cur.choices.length) answer(+e.key - 1);
    else if (cur.done && e.key === "Enter" && e.target.tagName !== "BUTTON"){ e.preventDefault(); nextQ(); }
  }
});
renderCount(); route();
</script>
</body>
</html>
